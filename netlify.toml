[build]
  command = "npm run build"
  publish = "dist"

# Le service worker ne doit jamais être servi depuis le cache HTTP, sinon la
# détection de nouvelle version (bandeau « Mise à jour disponible ») peut avoir
# jusqu'à 24 h de retard.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Les assets Vite sont hashés : cache long sans risque.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA : toute route retombe sur l'app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
